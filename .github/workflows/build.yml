name: Build and Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AgenticWorkflows.csproj
      - name: Build
        run: dotnet build AgenticWorkflows.csproj --no-restore --configuration Release
      - name: Run the workflow demo (offline, mock chat service)
        run: dotnet run --project AgenticWorkflows.csproj --no-build --configuration Release
